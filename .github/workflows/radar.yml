name: Mysterious Early Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mysterious-early-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run radar
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python radar.py

      - name: Save radar memory
        run: |
          echo "Checking radar memory..."

          if [ ! -f seen_tokens.json ]; then
            echo "seen_tokens.json does not exist."
            exit 1
          fi

          echo "Memory file:"
          cat seen_tokens.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f seen_tokens.json

          if git diff --cached --quiet; then
            echo "No memory changes to save."
          else
            git commit -m "Update radar memory"
            git push origin HEAD:${{ github.ref_name }}
          fi

          echo "Radar memory save step completed."

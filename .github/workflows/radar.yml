name: Mysterious Early Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mysterious-early-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run radar
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python radar.py

      - name: Save radar memory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "===== RADAR MEMORY BEFORE SAVE ====="
          cat seen_tokens.json
          echo "====================================="

          export SHA=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/seen_tokens.json?ref=$BRANCH" \
            | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))")

          if [ -z "$SHA" ]; then
            echo "❌ Could not find seen_tokens.json on GitHub."
            exit 1
          fi

          echo "Existing file SHA found."

          python - <<'PY' > /tmp/payload.json
          import os
          import json
          import base64

          with open("seen_tokens.json", "rb") as f:
              content = base64.b64encode(f.read()).decode()

          payload = {
              "message": "Update radar memory",
              "content": content,
              "sha": os.environ["SHA"],
              "branch": os.environ["BRANCH"]
          }

          print(json.dumps(payload))
          PY

          echo "Saving radar memory to GitHub..."

          curl -f -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/contents/seen_tokens.json" \
            --data-binary @/tmp/payload.json

          echo ""
          echo "✅ RADAR MEMORY SAVED SUCCESSFULLY."

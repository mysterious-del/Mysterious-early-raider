name: Mysterious Token Research

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Blockchain"
        required: true
        default: "solana"

      contract:
        description: "Token contract address"
        required: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Token Research
        run: |
          python research.py \
            "${{ inputs.chain }}" \
            "${{ inputs.contract }}"
